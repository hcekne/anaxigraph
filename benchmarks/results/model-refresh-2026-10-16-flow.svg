<text x="64" y="230" class="section" >1  Build the repository map</text>
<text x="64" y="261" class="body" style="fill:#53657a">Luna performed every model task in this pilot. Arrows show how evidence feeds the next step.</text>
<rect x="64" y="292" width="260" height="186" rx="16" fill="#f1f4f8" stroke="#ccd7e4"/>
<rect x="82" y="310" width="32" height="32" rx="10" fill="#ffffff" stroke="#ccd7e4"/>
<text x="98" y="332" class="body" text-anchor="middle" style="font-weight:700">1</text>
<text x="128" y="332" class="label" >SOFTWARE</text>
<text x="82" y="372" class="heading" >Scan the source</text>
<text x="82" y="404" class="body" >Parse symbols + imports</text>
<text x="82" y="429" class="body" >Resolve dependencies</text>
<text x="82" y="454" class="body" >Record source hashes</text>
<rect x="374" y="292" width="260" height="186" rx="16" fill="#eaf8f3" stroke="#a5d8c6"/>
<rect x="392" y="310" width="32" height="32" rx="10" fill="#ffffff" stroke="#a5d8c6"/>
<text x="408" y="332" class="body" text-anchor="middle" style="font-weight:700">2</text>
<text x="438" y="332" class="label" >LUNA</text>
<text x="392" y="372" class="heading" >Describe each file</text>
<text x="392" y="404" class="body" >Purpose, responsibilities</text>
<text x="392" y="429" class="body" >Contracts + evidence</text>
<text x="392" y="454" class="body" >12 intrinsic jobs</text>
<rect x="684" y="292" width="260" height="186" rx="16" fill="#eaf8f3" stroke="#a5d8c6"/>
<rect x="702" y="310" width="32" height="32" rx="10" fill="#ffffff" stroke="#a5d8c6"/>
<text x="718" y="332" class="body" text-anchor="middle" style="font-weight:700">3</text>
<text x="748" y="332" class="label" >LUNA</text>
<text x="702" y="372" class="heading" >Add context</text>
<text x="702" y="404" class="body" >Read nearby descriptions</text>
<text x="702" y="429" class="body" >Use dependency evidence</text>
<text x="702" y="454" class="body" >12 contextual jobs</text>
<rect x="994" y="292" width="260" height="186" rx="16" fill="#eaf8f3" stroke="#a5d8c6"/>
<rect x="1012" y="310" width="32" height="32" rx="10" fill="#ffffff" stroke="#a5d8c6"/>
<text x="1028" y="332" class="body" text-anchor="middle" style="font-weight:700">4</text>
<text x="1058" y="332" class="label" >LUNA</text>
<text x="1012" y="372" class="heading" >Propose the map</text>
<text x="1012" y="404" class="body" >Areas → subsystems</text>
<text x="1012" y="429" class="body" >Place files by purpose</text>
<text x="1012" y="454" class="body" >1 proposal job</text>
<path d="M328 385 H366" class="arrow"/>
<path d="M638 385 H676" class="arrow"/>
<path d="M948 385 H986" class="arrow"/>
<path d="M1124 482 V544" class="arrow"/>
<text x="1114" y="518" class="small" text-anchor="end" style="fill:#53657a">validate + repair</text>
<rect x="994" y="554" width="260" height="186" rx="16" fill="#eaf8f3" stroke="#a5d8c6"/>
<rect x="1012" y="572" width="32" height="32" rx="10" fill="#ffffff" stroke="#a5d8c6"/>
<text x="1028" y="594" class="body" text-anchor="middle" style="font-weight:700">5</text>
<text x="1058" y="594" class="label" >LUNA</text>
<text x="1012" y="634" class="heading" >Review + revise</text>
<text x="1012" y="666" class="body" >Critique the current map</text>
<text x="1012" y="691" class="body" >2 successive review jobs</text>
<text x="1012" y="716" class="body" >Validate after each pass</text>
<rect x="684" y="554" width="260" height="186" rx="16" fill="#eaf8f3" stroke="#a5d8c6"/>
<rect x="702" y="572" width="32" height="32" rx="10" fill="#ffffff" stroke="#a5d8c6"/>
<text x="718" y="594" class="body" text-anchor="middle" style="font-weight:700">6</text>
<text x="748" y="594" class="label" >LUNA</text>
<text x="702" y="634" class="heading" >Summarize groups</text>
<text x="702" y="666" class="body" >4 areas + 5 subsystems</text>
<text x="702" y="691" class="body" >Combine member meanings</text>
<text x="702" y="716" class="body" >9 group jobs</text>
<rect x="374" y="554" width="260" height="186" rx="16" fill="#eaf8f3" stroke="#a5d8c6"/>
<rect x="392" y="572" width="32" height="32" rx="10" fill="#ffffff" stroke="#a5d8c6"/>
