<text x="128" y="594" class="label" >SOFTWARE</text>
<text x="82" y="634" class="heading" >Use the map</text>
<text x="82" y="666" class="body" >Stored in SQLite</text>
<text x="82" y="691" class="body" >Explore in the dashboard</text>
<text x="82" y="716" class="body" >Read via CLI and MCP</text>
<path d="M990 647 H952" class="arrow"/>
<path d="M680 647 H642" class="arrow"/>
