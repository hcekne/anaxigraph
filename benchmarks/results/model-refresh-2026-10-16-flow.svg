<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1500" viewBox="0 0 1320 1500" role="img" aria-labelledby="title description">
<title id="title">AnaxiGraph mapping and independent model reviews</title>
<desc id="description">The 16 October 2026 pilot scanned 12 source files with deterministic software. GPT-6 Luna wrote 12 source descriptions and 12 contextual descriptions, proposed the responsibility map, reviewed it twice, and wrote nine group summaries and a repository Charter. Software validated and repaired each proposed map. The completed pilot and the same source packet were then independently reviewed by GPT-6.1 Sol and Claude Opus 5.5. These two models reviewed AnaxiGraph improvements outside the mapping pipeline, without seeing each other’s answers.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8" fill="none" stroke="#718096" stroke-width="1.5"/></marker></defs>
