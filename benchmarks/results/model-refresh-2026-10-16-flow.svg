<text x="438" y="594" class="label" >LUNA</text>
<text x="392" y="634" class="heading" >Write the Charter</text>
<text x="392" y="666" class="body" >Explain repository purpose</text>
<text x="392" y="691" class="body" >Describe architecture</text>
<text x="392" y="716" class="body" >1 repository job</text>
<rect x="64" y="554" width="260" height="186" rx="16" fill="#f1f4f8" stroke="#ccd7e4"/>
<rect x="82" y="572" width="32" height="32" rx="10" fill="#ffffff" stroke="#ccd7e4"/>
