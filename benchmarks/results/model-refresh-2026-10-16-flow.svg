<rect x="64" y="764" width="1190" height="46" rx="10" fill="#f2f5f9" stroke="#e1e7ef"/>
<text x="82" y="793" class="body" style="fill:#45576c">Software checks each map: file coverage, valid placements, grouping limits and configured locks.</text>
<text x="64" y="844" class="body" style="font-weight:600">37 model jobs · 197.3 seconds · two workers · final map covers all 12 files</text>
<text x="64" y="877" class="small" style="fill:#53657a">Later scans reuse current work; changed inputs refresh affected descriptions and downstream results.</text>
<rect x="40" y="946" width="1240" height="366" rx="16" fill="#ffffff" stroke="#dbe3ec"/>
<text x="64" y="990" class="section" >2  Ask how AnaxiGraph itself could improve</text>
<text x="64" y="1020" class="body" style="fill:#53657a">Separate, independent reviews after mapping — neither reviewer received the other’s answer.</text>
<rect x="64" y="1066" width="256" height="174" rx="16" fill="#f1f4f8" stroke="#ccd7e4"/>
<text x="84" y="1101" class="heading" >Same evidence packet</text>
<text x="84" y="1134" class="body" >Source + completed pilot</text>
<text x="84" y="1160" class="body" >Descriptions, assignments</text>
<text x="84" y="1186" class="body" >Usage and repair history</text>
<rect x="398" y="1054" width="366" height="100" rx="16" fill="#eef0ff" stroke="#bbc5ee"/>
<text x="420" y="1088" class="heading" style="fill:#3c4d98">GPT-6.1 Sol</text>
<text x="420" y="1117" class="small" >Independent improvement review</text>
<text x="420" y="1140" class="small" >High reasoning effort</text>
<rect x="398" y="1176" width="366" height="100" rx="16" fill="#fff1e7" stroke="#ebc5ab"/>
<text x="420" y="1210" class="heading" style="fill:#8c4c26">Claude Opus 5.5</text>
<text x="420" y="1239" class="small" >Independent improvement review</text>
<text x="420" y="1262" class="small" >High reasoning effort</text>
<path d="M324 1153 H358 V1104 H390" class="arrow"/>
<path d="M358 1153 V1226 H390" class="arrow"/>
<rect x="858" y="1084" width="396" height="164" rx="16" fill="#f1f4f8" stroke="#ccd7e4"/>
<text x="880" y="1120" class="heading" >Check the suggestions</text>
<text x="880" y="1153" class="body" >Inspect source; reproduce mechanics</text>
<text x="880" y="1179" class="body" >Separate findings from hypotheses</text>
<text x="880" y="1205" class="body" >Prioritize small, testable improvements</text>
<path d="M768 1104 H806 V1166 H850" class="arrow"/>
<path d="M768 1226 H806 V1166" class="arrow"/>
<text x="64" y="1296" class="small" style="fill:#53657a">These reviews produced ideas for development; they did not change the pilot’s map.</text>
<path d="M60 670 H24 V1153 H56" class="arrow"/>
<rect x="40" y="1340" width="1240" height="124" rx="16" fill="#f8fafc" stroke="#ccd7e4"/>
<text x="64" y="1374" class="heading" >What is optional or still ahead</text>
<text x="64" y="1405" class="body" >Production also supports detailed pattern analysis and a requested fresh-eyes workflow; this pilot ran neither.</text>
<text x="64" y="1434" class="body" >Putting Sol and Opus into the map-revision loop is a possible next experiment, not a configured handoff today.</text>
</svg>
