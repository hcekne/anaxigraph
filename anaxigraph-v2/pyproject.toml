[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anaxigraph"
version = "1.0.0a1"
description = "A compact code graph helping people and agents make maintainable changes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "mcp>=1.28,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
anaxigraph = "anaxigraph.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anaxigraph = ["analysis/catalog/*.json", "interfaces/assets/*.html", "interfaces/assets/*.css", "interfaces/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
