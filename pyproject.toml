[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anaxigraph"
version = "0.1.0"
description = "A temporal architecture and intelligence layer for software repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AnaxiGraph contributors" }]
keywords = ["architecture", "static-analysis", "knowledge-graph", "mcp", "code-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.28,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
anaxigraph = "codeintel.cli:main"
codeintel = "codeintel.cli:main"

[project.urls]
Homepage = "https://github.com/hcekne/anaxigraph"
Repository = "https://github.com/hcekne/anaxigraph"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeintel = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js", "dashboard/*.svg"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
