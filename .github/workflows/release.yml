name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trusted-publisher:
    name: Verify PyPI trusted publisher without uploading
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anaxigraph/
    permissions:
      id-token: write
    steps:
      - name: Mint and discard a short-lived PyPI token
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")"
          oidc_token="$(jq -er '.value | select(length > 0)' <<< "${oidc_response}")"
          echo "::add-mask::${oidc_token}"

          mint_payload="$(jq -cn --arg token "${oidc_token}" '{token: $token}')"
          mint_response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "${mint_payload}" \
            https://pypi.org/_/oidc/mint-token)"
          api_token="$(jq -er '.token | select(length > 0)' <<< "${mint_response}")"
          echo "::add-mask::${api_token}"

          unset api_token mint_response mint_payload oidc_token oidc_response
          echo "PyPI accepted the configured GitHub OIDC publisher; no artifact was uploaded."

  build:
    name: Build and attest immutable artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked release tooling
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
      - name: Validate tag and unused PyPI version
        id: contract
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run python scripts/verify_release_artifacts.py \
            --tag "${RELEASE_TAG}" \
            --check-pypi \
            --version-only)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build and validate wheel and source distribution
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python scripts/build_release_artifacts.py --outdir dist
          uv run twine check dist/*
          mkdir -p release
          uv run python scripts/verify_release_artifacts.py \
            --dist dist \
            --tag "${RELEASE_TAG}" \
            --checksums release/SHA256SUMS \
            --report release/release-contract.json
          cp dist/*.whl dist/*.tar.gz release/
      - name: Build the version-matched Codex and Claude plugin
        run: |
          uv run python scripts/check_agent_package.py
          uv run python scripts/build_agent_plugin.py \
            --output "release/anaxigraph-agent-plugin-${{ steps.contract.outputs.version }}.zip" \
            >> release/SHA256SUMS
      - name: Install the exact wheel for dependency inventory
        run: |
          python -m venv "${RUNNER_TEMP}/release-audit"
          "${RUNNER_TEMP}/release-audit/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "${RUNNER_TEMP}/release-audit/bin/python" -c "from anaxigraph.analyzers.javascript import TypeScriptAnalyzer; result = TypeScriptAnalyzer().analyze('view.tsx', 'export const View = () => <main />;'); assert result.parse_status == 'parsed' and result.symbols"
          "${RUNNER_TEMP}/release-audit/bin/python" scripts/report_installed_distributions.py \
            --output release/dependency-licenses.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: src
          format: spdx-json
          output-file: release/anaxigraph-${{ steps.contract.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest release bundle
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Preserve release evidence
        uses: actions/upload-artifact@v6
        with:
          name: anaxigraph-${{ steps.contract.outputs.version }}-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI with trusted identity
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anaxigraph/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download attested release bundle
        uses: actions/download-artifact@v7
        with:
          name: anaxigraph-${{ needs.build.outputs.version }}-release
          path: release
      - name: Select only Python distribution files
        run: |
          mkdir -p dist
          cp release/*.whl release/*.tar.gz dist/
      - name: Publish immutable Python artifacts
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  publish-github:
    name: Attach durable GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download attested release bundle
        uses: actions/download-artifact@v7
        with:
          name: anaxigraph-${{ needs.build.outputs.version }}-release
          path: release
      - name: Attach the verified bundle to the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: gh release upload "${RELEASE_TAG}" release/* --clobber --repo "${GITHUB_REPOSITORY}"

  verify-pypi:
    name: Verify public installation
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and run the published version
        run: |
          python -m venv "${RUNNER_TEMP}/public-install"
          "${RUNNER_TEMP}/public-install/bin/python" -m pip install \
            --disable-pip-version-check \
            --retries 10 \
            "anaxigraph==${{ needs.build.outputs.version }}"
          "${RUNNER_TEMP}/public-install/bin/anaxigraph" --version
