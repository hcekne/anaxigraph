name: V2 milestone

on:
  push:
    branches: [main]
    paths: ["anaxigraph-v2/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["anaxigraph-v2/**", ".github/workflows/v2.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2:
    name: V2 Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: anaxigraph-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install isolated V2 project
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Check V2 behavior and boundaries
        run: |
          uv run pytest
          uv run ruff check src tests
          uv run ruff format --check src tests
          node --check src/anaxigraph/interfaces/assets/app.js
      - name: Build the standalone V2 package
        run: uv build
      - name: Exercise the installed wheel through uvx
        run: |
          uvx --from dist/*.whl anaxigraph --version
          mkdir -p "${RUNNER_TEMP}/v2-fixture"
          echo "def create_invoice(): return {'id': 1}" > "${RUNNER_TEMP}/v2-fixture/billing.py"
          uvx --from dist/*.whl anaxigraph scan --repo "${RUNNER_TEMP}/v2-fixture"
          uvx --from dist/*.whl anaxigraph request patterns --repo "${RUNNER_TEMP}/v2-fixture" > "${RUNNER_TEMP}/v2-pattern-task.json"
          python -c 'import json,os,pathlib; p=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"v2-pattern-task.json").read_text()); assert len(p["packet"]["catalogue"]) == 133'
      - uses: actions/upload-artifact@v6
        with:
          name: anaxigraph-v2-${{ matrix.python }}
          path: anaxigraph-v2/dist/*
