name: Container

# A tag pushed by GITHUB_TOKEN starts no workflow: GitHub suppresses those events to
# prevent loops. auto-release therefore calls this file directly rather than relying on the
# tag it just created, which is why v0.7.1 published to PyPI with no container image.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build, for example v0.7.2.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build. Defaults to the ref this run was started from.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and verify
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run python scripts/check_module_size.py
          uv run python scripts/check_code_quality.py
          uv run python scripts/check_architecture.py
          uv run python scripts/check_forbidden_files.py --all-tracked
          uv run pytest --cov=anaxigraph --cov-fail-under=80
          uv run python scripts/check_javascript_syntax.py \
            src/anaxigraph/dashboard/app.js \
            benchmarks/dashboard_render.mjs
          docker compose -f compose.yml config --quiet

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          python-version: "3.12"
      - name: Require the container tag to match the Python package
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify_release_artifacts.py --tag "${RELEASE_TAG}" --version-only
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest the published image digest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          version="${RELEASE_TAG#v}"
          echo "${{ steps.build.outputs.digest }}  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${version}" \
            > "release/anaxigraph-container-${RELEASE_TAG}.sha256"
      - name: Preserve container digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: anaxigraph-container-${{ inputs.tag || github.ref_name }}
          path: release/
          if-no-files-found: error
