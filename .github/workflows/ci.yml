name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install uv and project
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
      - name: Run tracked commit checks
        run: uv run pre-commit run --all-files
      - name: Enforce whole-repository policies
        run: |
          uv run python scripts/check_module_size.py
          uv run python scripts/check_code_quality.py
          uv run python scripts/check_architecture.py
          uv run python scripts/check_forbidden_files.py --all-tracked
      - name: Reject deterministic self-analysis regressions
        run: |
          uv run python scripts/check_self_analysis.py \
            --output "${RUNNER_TEMP}/anaxigraph-self-analysis.json"
      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=anaxigraph \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
      - name: Enforce changed-code coverage
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run python scripts/check_changed_coverage.py \
            --report coverage.xml \
            --base "${COVERAGE_BASE}"
      - name: Validate Compose definitions
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.maxos.yml config --quiet
      - name: Exercise the generated hardened container sidecar
        run: |
          uv run python scripts/smoke_container_sidecar.py \
            --image anaxigraph:quality-gate \
            --output "${RUNNER_TEMP}/anaxigraph-container-smoke.json"
      - name: Run bounded performance smoke benchmark
        run: |
          uv run python -m benchmarks.baseline \
            --repository . \
            --synthetic-files 120 \
            --history-frames 8 \
            --skip-tests \
            --skip-dashboard \
            --output "${RUNNER_TEMP}/anaxigraph-baseline-smoke.json"
      - name: Enforce the first-user time-to-value journey
        run: |
          uv run python -m benchmarks.first_user \
            --runs 3 \
            --output "${RUNNER_TEMP}/anaxigraph-first-user.json"
      - name: Upload coverage and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-evidence
          path: |
            coverage.xml
            ${{ runner.temp }}/anaxigraph-self-analysis.json
            ${{ runner.temp }}/anaxigraph-baseline-smoke.json
            ${{ runner.temp }}/anaxigraph-first-user.json
            ${{ runner.temp }}/anaxigraph-container-smoke.json
          if-no-files-found: warn

  python-compatibility:
    name: Python 3.12 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv and project
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
      - name: Run tests
        run: uv run pytest

  package-contract:
    name: Package · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build validated release artifacts
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
          uv run python scripts/build_release_artifacts.py --outdir dist
          uv run twine check dist/*
          uv run python scripts/verify_release_artifacts.py --dist dist
      - name: Install and run the wheel in isolation
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-install"
          "${RUNNER_TEMP}/wheel-install/bin/python" -m pip install \
            --disable-pip-version-check dist/*.whl
          "${RUNNER_TEMP}/wheel-install/bin/anaxigraph" --version
          "${RUNNER_TEMP}/wheel-install/bin/python" -c \
            "from importlib.resources import files; assert (files('anaxigraph') / 'dashboard' / 'findings-view.js').is_file()"
          mkdir -p "${RUNNER_TEMP}/fixture-repository"
          echo "def architecture_fixture(): return 'anaxigraph'" \
            > "${RUNNER_TEMP}/fixture-repository/app.py"
          git -C "${RUNNER_TEMP}/fixture-repository" init --initial-branch=main
          git -C "${RUNNER_TEMP}/fixture-repository" config user.name "AnaxiGraph CI"
          git -C "${RUNNER_TEMP}/fixture-repository" config user.email "ci@anaxigraph.invalid"
          git -C "${RUNNER_TEMP}/fixture-repository" add app.py
          git -C "${RUNNER_TEMP}/fixture-repository" commit -m "Initial fixture"
          "${RUNNER_TEMP}/wheel-install/bin/anaxigraph" init \
            "${RUNNER_TEMP}/fixture-repository" \
            --no-compose
          "${RUNNER_TEMP}/wheel-install/bin/anaxigraph" scan \
            "${RUNNER_TEMP}/fixture-repository" \
            --db "${RUNNER_TEMP}/fresh-install.db"
      - name: Install and run the source distribution in isolation
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-install"
          "${RUNNER_TEMP}/sdist-install/bin/python" -m pip install \
            --disable-pip-version-check dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-install/bin/anaxigraph" --version
      - name: Exercise the local uvx artifact path
        run: |
          uvx --from dist/*.whl anaxigraph --version
          mkdir -p "${RUNNER_TEMP}/uvx-repository"
          echo "def first_run(): return 'ready'" > "${RUNNER_TEMP}/uvx-repository/app.py"
          git -C "${RUNNER_TEMP}/uvx-repository" init --initial-branch=main
          git -C "${RUNNER_TEMP}/uvx-repository" config user.name "AnaxiGraph CI"
          git -C "${RUNNER_TEMP}/uvx-repository" config user.email "ci@anaxigraph.invalid"
          git -C "${RUNNER_TEMP}/uvx-repository" add app.py
          git -C "${RUNNER_TEMP}/uvx-repository" commit -m "Initial uvx fixture"
          uvx --from dist/*.whl anaxigraph up \
            "${RUNNER_TEMP}/uvx-repository" \
            --db "${RUNNER_TEMP}/uvx-first-run.db" \
            --port 9876 \
            --history-snapshots 0 \
            >"${RUNNER_TEMP}/uvx-first-run.log" 2>&1 &
          up_pid=$!
          ready=0
          for _attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:9876/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "${up_pid}" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if test "${ready}" != 1; then
            cat "${RUNNER_TEMP}/uvx-first-run.log"
            exit 1
          fi
          kill -INT "${up_pid}"
          wait "${up_pid}"
          test -f "${RUNNER_TEMP}/uvx-repository/.anaxigraph.yml"
          test -f "${RUNNER_TEMP}/uvx-first-run.db"

  dashboard-browser:
    name: Dashboard browser contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install project and browser
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Start fixture dashboard
        run: |
          uv run python -m benchmarks.dashboard_fixture \
            "${RUNNER_TEMP}/dashboard-fixture"
          uv run anaxigraph serve \
            --repository "${RUNNER_TEMP}/dashboard-fixture" \
            --db "${RUNNER_TEMP}/browser-anaxi-index.db" \
            --host 127.0.0.1 \
            --port 8765 \
            --scan-on-start \
            >"${RUNNER_TEMP}/anaxigraph-browser.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/anaxigraph-browser.pid"
          for _attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8765/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/anaxigraph-browser.log"
          exit 1
      - name: Run dashboard contracts
        run: npm run test:visual
      - name: Stop fixture dashboard
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/anaxigraph-browser.pid"; then
            kill "$(cat "${RUNNER_TEMP}/anaxigraph-browser.pid")" || true
          fi
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-browser-diagnostics
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/anaxigraph-browser.log
          if-no-files-found: warn
