project:
  name: AnaxiGraph

architecture:
  policy: docs/coding-patterns.md
  protected_paths:
    - src/anaxigraph/storage.py
    - src/anaxigraph/mcp_server.py
  rules:
    - id: module-size
      type: max_module_loc
      severity: warning
      max: 500
      paths: [src/**]
    - id: function-size
      type: max_function_lines
      severity: info
      max: 40
      paths: [src/**]
    - id: symbol-complexity
      type: max_symbol_complexity
      severity: warning
      max: 15
    - id: fan-out
      type: max_fan_out
      severity: warning
      max: 15
    - id: dependency-cycles
      type: no_cycles
      severity: error

groups:
  web-frontend:
    level: subsystem
    parent: application
    description: Renders the interactive human dashboard and its browser-side workflows.
    paths: [src/anaxigraph/dashboard/**]
  backend-api:
    level: subsystem
    parent: application
    description: Serves the read-only REST API and coordinates repository operations.
    paths: [src/anaxigraph/api*.py]
  agent-integration:
    level: subsystem
    parent: application
    description: Gives coding agents bounded architecture evidence and write-back protocols.
    paths:
      - src/anaxigraph/mcp*.py
      - src/anaxigraph/*_mcp.py
      - src/anaxigraph/*_transport.py
  developer-experience:
    level: subsystem
    parent: application
    description: Owns CLI commands, onboarding, local startup, and environment diagnosis.
    paths:
      - src/anaxigraph/cli*.py
      - src/anaxigraph/*_cli.py
      - src/anaxigraph/onboarding*.py
      - src/anaxigraph/local_runtime.py
      - src/anaxigraph/environment_doctor.py
  repository-analysis:
    level: subsystem
    parent: application
    description: Extracts deterministic code facts, symbols, references, and repository identity.
    paths:
      - src/anaxigraph/analyzers/**
      - src/anaxigraph/analyzer*.py
      - src/anaxigraph/architecture_vocabulary.py
      - src/anaxigraph/languages.py
      - src/anaxigraph/ir*.py
      - src/anaxigraph/relationship*.py
      - src/anaxigraph/scan*.py
      - src/anaxigraph/scanner.py
      - src/anaxigraph/git.py
      - src/anaxigraph/config*.py
      - src/anaxigraph/registry.py
  semantic-intelligence:
    level: subsystem
    parent: application
    description: Coordinates AI-funded module understanding, taxonomy, and semantic freshness.
    paths: [src/anaxigraph/semantic*.py]
  architecture-guidance:
    level: subsystem
    parent: application
    description: Evaluates patterns, findings, change impact, safety, and architectural decisions.
    paths:
      - src/anaxigraph/architecture*.py
      - src/anaxigraph/coverage.py
      - src/anaxigraph/agent*.py
      - src/anaxigraph/finding*.py
      - src/anaxigraph/pattern*.py
      - src/anaxigraph/catalog/**
      - src/anaxigraph/trend_service.py
      - src/anaxigraph/understanding.py
      - src/anaxigraph/guidance.py
  temporal-index:
    level: subsystem
    parent: application
    description: Owns the versioned AnaxiIndex, historical reconstruction, and replay frames.
    paths:
      - src/anaxigraph/storage.py
      - src/anaxigraph/persistence/**
      - src/anaxigraph/history*.py
  shared-runtime:
    level: subsystem
    parent: application
    description: Shared contracts and small runtime utilities used across product subsystems.
    paths: [src/anaxigraph/**]
  tests:
    level: subsystem
    parent: testing
    description: Verifies product behavior, compatibility, scale, and visual output.
    paths: [tests/**]
  docs:
    level: subsystem
    parent: documentation
    description: Explains the product, architecture, operations, and decisions.
    paths:
      - docs/**
      - '*.md'

agent:
  context_limit: 25
  neighbor_depth: 2
  payload_limit_bytes: 20000
  protected_paths:
    - src/anaxigraph/storage.py
    - src/anaxigraph/mcp_server.py

findings:
  attention:
    minimum_priority: 35
    minimum_severity: warning
    page_size: 20
    include_info_long_functions: false
  diagnostics:
    page_size: 50

coverage:
  files: [coverage.xml]

# Semantic understanding is opt-in because it sends eligible source and graph context to the
# configured model. See docs/onboarding.md before enabling it.
semantic:
  enabled: true
  provider: agent
  # Select a local executor model per `understand` run; it is provenance, not freshness policy.
  refresh: manual
  max_jobs_per_run: 1000
  # Independent semantic work can fan out aggressively; executor runs may choose a lower ceiling.
  max_parallel_jobs: 30
  timeout_seconds: 300
  agent_lease_seconds: 1800
