project:
  name: AnaxiGraph

architecture:
  policy: docs/coding-patterns.md
  protected_paths:
    - src/anaxigraph/storage.py
    - src/anaxigraph/mcp_server.py
  rules:
    - id: module-size
      type: max_module_loc
      severity: warning
      max: 500
      paths: [src/**]
    - id: function-size
      type: max_function_lines
      severity: info
      max: 40
      paths: [src/**]
    - id: symbol-complexity
      type: max_symbol_complexity
      severity: warning
      max: 15
    - id: fan-out
      type: max_fan_out
      severity: warning
      max: 15
    - id: dependency-cycles
      type: no_cycles
      severity: error

groups:
  extraction:
    level: subsystem
    parent: application
    description: Turns repository files into deterministic code facts and relationships.
    paths:
      - src/anaxigraph/analyzers/**
      - src/anaxigraph/architecture_vocabulary.py
      - src/anaxigraph/languages.py
      - src/anaxigraph/scanner.py
  intelligence:
    level: subsystem
    parent: application
    description: Evaluates architecture, patterns, findings, and semantic understanding.
    paths:
      - src/anaxigraph/architecture*.py
      - src/anaxigraph/coverage.py
      - src/anaxigraph/agent*.py
      - src/anaxigraph/finding*.py
      - src/anaxigraph/pattern*.py
      - src/anaxigraph/semantic*.py
      - src/anaxigraph/trend_service.py
      - src/anaxigraph/understanding.py
  persistence:
    level: subsystem
    parent: application
    description: Owns the versioned AnaxiIndex and its canonical temporal facts.
    paths:
      - src/anaxigraph/storage.py
      - src/anaxigraph/persistence/**
  interfaces:
    level: subsystem
    parent: application
    description: Exposes AnaxiGraph through the dashboard, CLI, REST, and MCP.
    paths:
      - src/anaxigraph/api*.py
      - src/anaxigraph/cli*.py
      - src/anaxigraph/dashboard/**
      - src/anaxigraph/mcp*.py
  tests:
    level: subsystem
    parent: testing
    description: Verifies product behavior, compatibility, scale, and visual output.
    paths: [tests/**]
  docs:
    level: subsystem
    parent: documentation
    description: Explains the product, architecture, operations, and decisions.
    paths:
      - docs/**
      - '*.md'

agent:
  context_limit: 25
  neighbor_depth: 2
  payload_limit_bytes: 20000
  protected_paths:
    - src/anaxigraph/storage.py
    - src/anaxigraph/mcp_server.py

findings:
  attention:
    minimum_priority: 35
    minimum_severity: warning
    page_size: 20
    include_info_long_functions: false
  diagnostics:
    page_size: 50

coverage:
  files: [coverage.xml]

# Semantic understanding is opt-in because it sends eligible source and graph context to the
# configured model. See docs/onboarding.md before enabling it.
semantic:
  enabled: true
  provider: agent
  # Select a local executor model per `understand` run; it is provenance, not freshness policy.
  refresh: manual
  max_jobs_per_run: 1000
  # Independent semantic work can fan out aggressively; executor runs may choose a lower ceiling.
  max_parallel_jobs: 30
  timeout_seconds: 300
  agent_lease_seconds: 1800
