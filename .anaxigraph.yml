project:
  name: AnaxiGraph

architecture:
  policy: docs/coding-patterns.md
  protected_paths:
    - src/anaxigraph/storage.py
    - src/anaxigraph/mcp_server.py
  rules:
    - id: module-size
      type: max_module_loc
      severity: warning
      max: 500
      paths: [src/**]
    - id: function-size
      type: max_function_lines
      severity: info
      max: 40
      paths: [src/**]
    - id: symbol-complexity
      type: max_symbol_complexity
      severity: warning
      max: 15
    - id: fan-out
      type: max_fan_out
      severity: warning
      max: 15
    - id: dependency-cycles
      type: no_cycles
      severity: error

groups:
  extraction:
    paths:
      - src/anaxigraph/analyzers/**
      - src/anaxigraph/languages.py
      - src/anaxigraph/scanner.py
  intelligence:
    paths:
      - src/anaxigraph/architecture.py
      - src/anaxigraph/coverage.py
      - src/anaxigraph/agent.py
      - src/anaxigraph/semantic.py
      - src/anaxigraph/semantic_*.py
      - src/anaxigraph/understanding.py
  persistence:
    paths: [src/anaxigraph/storage.py]
  interfaces:
    paths:
      - src/anaxigraph/api.py
      - src/anaxigraph/mcp_server.py
      - src/anaxigraph/cli.py
      - src/anaxigraph/dashboard/**
  tests:
    paths: [tests/**]
  documentation:
    paths:
      - docs/**
      - '*.md'

agent:
  context_limit: 25
  neighbor_depth: 2
  payload_limit_bytes: 20000
  protected_paths:
    - src/anaxigraph/storage.py
    - src/anaxigraph/mcp_server.py

findings:
  attention:
    minimum_priority: 35
    minimum_severity: warning
    page_size: 20
    include_info_long_functions: false
  diagnostics:
    page_size: 50

coverage:
  files: [coverage.xml]

# Semantic understanding is opt-in because it sends eligible source and graph context to the
# configured model. See docs/onboarding.md before enabling it.
semantic:
  enabled: true
  provider: agent
  # Select a local executor model per `understand` run; it is provenance, not freshness policy.
  refresh: manual
  max_jobs_per_run: 1000
  max_parallel_jobs: 8
  agent_lease_seconds: 1800
